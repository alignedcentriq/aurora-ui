# Centriq — SPA served statically from this image; /api + /verify proxied to the backend.
# Static bundle baked at /usr/share/nginx/html/centriq (see nginx/Dockerfile).
#
# Backend upstream uses a variable + resolver so nginx still starts if the backend
# container isn't up yet (Docker's embedded DNS is 127.0.0.11).

# Shared proxy settings for the API (long LLM calls + SSE streaming).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 valid=30s;
    client_max_body_size 50m;
    root /usr/share/nginx/html;

    location = / { return 301 /centriq/; }
    location = /centriq { return 301 /centriq/; }

    location /centriq/ {
        try_files $uri $uri/ /centriq/index.html;
    }

    location /api {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Public document-verification page — backend route at the ROOT (not under /api).
    location /verify {
        set $verify_upstream http://backend:8080;
        proxy_pass $verify_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}

server {
    listen 80;
    server_name hackathon.alignedautomation.com;

    resolver 127.0.0.11 valid=30s;
    client_max_body_size 50m;
    root /usr/share/nginx/html;

    # ACME challenge for certbot (branch A only; harmless otherwise).
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location = / { return 301 /centriq/; }
    location = /centriq { return 301 /centriq/; }

    location /centriq/ {
        try_files $uri $uri/ /centriq/index.html;
    }

    location /api {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /verify {
        set $verify_upstream http://backend:8080;
        proxy_pass $verify_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}

# SSL server — only activated once certs exist (see first-deploy.sh). Branch A only.
server {
    listen 443 ssl;
    server_name hackathon.alignedautomation.com;

    ssl_certificate     /etc/letsencrypt/live/hackathon.alignedautomation.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hackathon.alignedautomation.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=30s;
    client_max_body_size 50m;
    root /usr/share/nginx/html;

    location = / { return 301 /centriq/; }
    location = /centriq { return 301 /centriq/; }

    location /centriq/ {
        try_files $uri $uri/ /centriq/index.html;
    }

    location /api {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /verify {
        set $verify_upstream http://backend:8080;
        proxy_pass $verify_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}

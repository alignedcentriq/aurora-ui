# HTTP-only variant — used during the first deploy before certs exist (see first-deploy.sh).
# Same static-SPA + /api + /verify layout as nginx.conf, minus the 443 block.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 valid=30s;
    client_max_body_size 50m;
    root /usr/share/nginx/html;

    location = / { return 301 /centriq/; }
    location = /centriq { return 301 /centriq/; }

    location /centriq/ {
        try_files $uri $uri/ /centriq/index.html;
    }

    # Backend routes under the /centriq prefix. The shared host owns bare /api (a different
    # app), so the browser sends everything under /centriq; strip the prefix before the backend.
    location /centriq/api/ {
        set $backend_upstream http://backend:8080;
        rewrite ^/centriq(/api/.*)$ $1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /centriq/uploads/ {
        set $uploads_upstream http://backend:8080;
        rewrite ^/centriq(/uploads/.*)$ $1 break;
        proxy_pass $uploads_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /centriq/verify {
        set $verify_c_upstream http://backend:8080;
        rewrite ^/centriq(/verify.*)$ $1 break;
        proxy_pass $verify_c_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /verify {
        set $verify_upstream http://backend:8080;
        proxy_pass $verify_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; }
}

# ── Langfuse UI (Option 2: dedicated subdomain, no extra public port) ──────────
# Reverse-proxies the whole Langfuse app at the root of its own subdomain. Langfuse
# (Next.js) does NOT support sub-path hosting, so it must live at a host root — hence
# a subdomain rather than a /langfuse/ path on the main site.
# REQUIRES (admin, once): (1) DNS record langfuse.hackathon.alignedautomation.com →
# the server, and (2) the HOST nginx forwarding that Host → 127.0.0.1:8090 (exactly
# like it already forwards hackathon.alignedautomation.com). Langfuse's NEXTAUTH_URL
# must equal the public URL below (set in docker-compose.yml).
server {
    listen 80;
    server_name langfuse.hackathon.alignedautomation.com;

    resolver 127.0.0.11 valid=30s;
    client_max_body_size 50m;

    location / {
        set $langfuse_upstream http://langfuse-server:3000;
        proxy_pass $langfuse_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }
}

server {
    listen 80;
    server_name hackathon.alignedautomation.com;

    resolver 127.0.0.11 valid=30s;

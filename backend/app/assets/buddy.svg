<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none">
  <defs>
    <linearGradient id="face" x1="27" y1="30" x2="69" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d2440"/>
      <stop offset="1" stop-color="#071428"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <radialGradient id="tip" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#D97706"/>
    </radialGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#062038" flood-opacity="0.30"/>
    </filter>
  </defs>

  <g filter="url(#ds)">
    <!-- antenna -->
    <line x1="48" y1="8" x2="48" y2="23" stroke="#0d1b2e" stroke-width="3" stroke-linecap="round"/>
    <circle cx="48" cy="8" r="5.5" fill="url(#tip)"/>
    <circle cx="46.3" cy="6.3" r="1.6" fill="#fff" fill-opacity="0.85"/>

    <!-- ears -->
    <rect x="13" y="40" width="8" height="16" rx="4" fill="#eef4fb" stroke="#0d1b2e" stroke-width="2.5"/>
    <rect x="75" y="40" width="8" height="16" rx="4" fill="#eef4fb" stroke="#0d1b2e" stroke-width="2.5"/>

    <!-- head -->
    <rect x="20" y="22" width="56" height="48" rx="15" fill="#ffffff" stroke="#0d1b2e" stroke-width="2.5"/>

    <!-- face screen -->
    <rect x="27" y="30" width="42" height="32" rx="11" fill="url(#face)"/>

    <!-- eyes -->
    <circle cx="40" cy="44" r="5.4" fill="url(#eye)"/>
    <circle cx="56" cy="44" r="5.4" fill="url(#eye)"/>
    <circle cx="38.2" cy="42.2" r="1.7" fill="#ffffff"/>
    <circle cx="54.2" cy="42.2" r="1.7" fill="#ffffff"/>

    <!-- smile -->
    <path d="M40 53 Q48 59 56 53" stroke="#5eead4" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>

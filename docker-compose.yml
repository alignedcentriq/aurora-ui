services:
  nginx:
    image: nginx:alpine
    ports:
      - "8090:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - centriq-network
    depends_on:
      - frontend
      - backend
    restart: always

  frontend:
    build:
      context: .
      args:
        - VITE_MSAL_CLIENT_ID=${VITE_MSAL_CLIENT_ID}
        - VITE_MSAL_TENANT_ID=${VITE_MSAL_TENANT_ID}
        - VITE_MSAL_REDIRECT_URI=${VITE_MSAL_REDIRECT_URI}
        - VITE_MSAL_AUTHORITY=${VITE_MSAL_AUTHORITY}
    restart: always
    environment:
      - PORT=3000
      - NODE_ENV=production
    networks:
      - centriq-network
    depends_on:
      - backend

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - LANGFUSE_HOST=http://langfuse-server:3000
    networks:
      - centriq-network
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server /etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    networks:
      - centriq-network
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Separate postgres only for Langfuse — app uses hosted DB via backend/.env
  langfuse-db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langfuse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - centriq-network
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    restart: always

  langfuse-server:
    image: langfuse/langfuse:2
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3003:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@langfuse-db:5432/langfuse
      - NEXTAUTH_SECRET=mysecret
      - SALT=mysalt
      - NEXTAUTH_URL=http://hackathon.alignedautomation.com:3003
      - TELEMETRY_ENABLED=false
    networks:
      - centriq-network
    restart: always

volumes:
  redis_data:
  langfuse_db_data:

networks:
  centriq-network:
    driver: bridge

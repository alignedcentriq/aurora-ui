version: "3.8"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - centriq-network
    depends_on:
      - redis
      - frontend
      - backend
    restart: always

  frontend:
    build: .
    restart: always
    environment:
      - PORT=3000
      - NODE_ENV=production
      - VITE_API_URL=/api
    networks:
      - centriq-network
    depends_on:
      - backend

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/centriq
      - REDIS_URL=redis://redis:6379
    networks:
      - centriq-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: centriq
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - centriq-network

  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    networks:
      - centriq-network
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    networks:
      - centriq-network
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    networks:
      - centriq-network
    entrypoint: >
      /bin/sh -c " until (/usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin) do echo '...waiting...' && sleep 1; done; /usr/bin/mc mb myminio/aurora-bucket; /usr/bin/mc policy set public myminio/aurora-bucket; exit 0; "

volumes:
  redis_data:
  minio_data:

networks:
  centriq-network:
    driver: bridge

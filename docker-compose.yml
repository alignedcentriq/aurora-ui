version: "3.8"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - centriq-network
    depends_on:
      - redis

  frontend:
    build: .
    environment:
      - PORT=3000
      - NODE_ENV=production
      - VITE_API_URL=/api
    networks:
      - centriq-network
    depends_on:
      - backend

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/centriq
      - REDIS_URL=redis://redis:6379
    networks:
      - centriq-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: centriq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - centriq-network

  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    networks:
      - centriq-network
    volumes:
      - redis_data:/data

volumes:
  redis_data:

networks:
  centriq-network:
    driver: bridge

services:
  # nginx builds the SPA (static, baked into the image) AND reverse-proxies /api + /verify.
  # The Node frontend container is gone — the bundle is served directly from disk.
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    # Branch B: host nginx (port 80) forwards hackathon.alignedautomation.com → 8090.
    # Host nginx config already has: proxy_pass http://127.0.0.1:8090 — no admin action needed.
    # Branch A only (we own 80/443): change to "80:80","443:443" and run first-deploy.sh.
    ports:
      - "8090:80"
    volumes:
      # Mounted conf wins over the baked copy — edit + `docker compose restart nginx`, no rebuild.
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - centriq-network
    depends_on:
      - backend
      - langfuse-server
    restart: always
 
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      # Runtime uploads (onboarding docs, induction videos) must survive container
      # recreation — without this mount they vanish on every rebuild.
      - ./backend/uploads:/backend/uploads
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - LANGFUSE_HOST=http://langfuse-server:3000
      # Keys must match the langfuse-server headless-init keys below. Injected here so
      # they win over anything (stale) in backend/.env. LANGFUSE_PROJECT_ID lets the
      # "Open in Langfuse" redirect build deep links without an API lookup.
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-centriq-ai}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-centriq-ai-2026}
      - LANGFUSE_PROJECT_ID=${LANGFUSE_PROJECT_ID:-centriq-ai}
      # Browser-facing Langfuse URL (Option 2 subdomain, proxied by nginx). Drives the
      # "Open in Langfuse" redirect. MUST equal langfuse-server's NEXTAUTH_URL below.
      - LANGFUSE_PUBLIC_URL=${LANGFUSE_PUBLIC_URL:-http://langfuse.hackathon.alignedautomation.com}
    extra_hosts:
      - "ml01:${ML01_IP}"
    networks:
      - centriq-network
    depends_on:
      redis:
        condition: service_healthy
    restart: always
 
  redis:
    image: redis:7-alpine
    command: redis-server /etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    networks:
      - centriq-network
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
 
  # Separate postgres only for Langfuse — app uses hosted DB via backend/.env
  langfuse-db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langfuse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - centriq-network
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    restart: always
 
  langfuse-server:
    image: langfuse/langfuse:2
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@langfuse-db:5432/langfuse
      - NEXTAUTH_SECRET=mysecret
      - SALT=mysalt
      # Public URL Langfuse serves under (Option 2 subdomain via nginx). NextAuth is
      # strict: this MUST match the browser origin exactly, and the backend's
      # LANGFUSE_PUBLIC_URL. No :3003 anymore — nginx fronts it on port 80.
      - NEXTAUTH_URL=${LANGFUSE_PUBLIC_URL:-http://langfuse.hackathon.alignedautomation.com}
      - TELEMETRY_ENABLED=false
      # ── Headless initialization (see docker-compose.infra.yml for the full note) ──
      # Auto-seeds org + project + login user with FIXED keys, matching the backend
      # service above. To re-seed after a key change, reset the langfuse_db_data volume.
      - LANGFUSE_INIT_ORG_ID=centriq
      - LANGFUSE_INIT_ORG_NAME=Centriq
      - LANGFUSE_INIT_PROJECT_ID=centriq-ai
      - LANGFUSE_INIT_PROJECT_NAME=Centriq AI
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-centriq-ai}
      - LANGFUSE_INIT_PROJECT_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-centriq-ai-2026}
      - LANGFUSE_INIT_USER_EMAIL=${LANGFUSE_INIT_USER_EMAIL:-shivam.sharma@alignedautomation.com}
      - LANGFUSE_INIT_USER_NAME=${LANGFUSE_INIT_USER_NAME:-Centriq Admin}
      - LANGFUSE_INIT_USER_PASSWORD=${LANGFUSE_INIT_USER_PASSWORD:-Centriq@2026}
      - AUTH_DISABLE_SIGNUP=true
    networks:
      - centriq-network
    restart: always
 
volumes:
  redis_data:
  langfuse_db_data:
 
networks:
  centriq-network:
    driver: bridge
 
 
services:
  nginx:
    image: nginx:alpine
    ports:
      - "8090:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      - centriq-network
    depends_on:
      - frontend
      - backend
    restart: always

  frontend:
    build:
      context: .
      args:
        - VITE_MSAL_CLIENT_ID=${VITE_MSAL_CLIENT_ID}
        - VITE_MSAL_TENANT_ID=${VITE_MSAL_TENANT_ID}
        - VITE_MSAL_REDIRECT_URI=${VITE_MSAL_REDIRECT_URI}
        - VITE_MSAL_AUTHORITY=${VITE_MSAL_AUTHORITY}
    restart: always
    environment:
      - PORT=3000
      - NODE_ENV=production
    networks:
      - centriq-network
    depends_on:
      - backend

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - MINIO_ENDPOINT=minio:9000
      - LANGFUSE_HOST=http://langfuse-server:3000
    networks:
      - centriq-network
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      loki:
        condition: service_started
    restart: always
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3002/loki/api/v1/push"

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server /etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    networks:
      - centriq-network
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SITE_NAME: centriq-prod
      MINIO_UPDATE: "off"
    command: server /data --console-address ":9001"
    networks:
      - centriq-network
    volumes:
      - minio_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - centriq-network
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing myminio/aurora-bucket;
      /usr/bin/mc mb --ignore-existing myminio/policies-bucket;
      /usr/bin/mc anonymous set none myminio/aurora-bucket;
      /usr/bin/mc anonymous set none myminio/policies-bucket;
      exit 0;"

  # Separate postgres only for Langfuse — app uses hosted DB via backend/.env
  langfuse-db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langfuse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - centriq-network
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    restart: always

  langfuse-server:
    image: langfuse/langfuse:2
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3003:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@langfuse-db:5432/langfuse
      - NEXTAUTH_SECRET=mysecret
      - SALT=mysalt
      - NEXTAUTH_URL=http://hackathon.alignedautomation.com:3003
      - TELEMETRY_ENABLED=false
    networks:
      - centriq-network
    restart: always

  loki:
    image: grafana/loki:latest
    ports:
      - "3002:3100"
    networks:
      - centriq-network
    volumes:
      - loki_data:/loki
    restart: always

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GRAFANA_POSTGRES_HOST=${GRAFANA_POSTGRES_HOST}
      - GRAFANA_POSTGRES_USER=${GRAFANA_POSTGRES_USER}
      - GRAFANA_POSTGRES_PASSWORD=${GRAFANA_POSTGRES_PASSWORD}
      - GRAFANA_POSTGRES_DB=${GRAFANA_POSTGRES_DB:-centriq}
    depends_on:
      - loki
    networks:
      - centriq-network
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards/json
      - grafana_data:/var/lib/grafana
    restart: always

volumes:
  redis_data:
  minio_data:
  langfuse_db_data:
  loki_data:
  grafana_data:

networks:
  centriq-network:
    driver: bridge
